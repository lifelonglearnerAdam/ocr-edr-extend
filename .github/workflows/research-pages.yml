name: Publish shared research page

on:
  push:
    branches: [feat/image-role-research]
    paths:
      - 'docs/site/**'
      - 'scripts/build_research_dashboard.py'
      - 'src/ocr_edr/research_dashboard.py'
      - '.github/workflows/research-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: research-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify and build the public evidence snapshot
        run: |
          python3 -m unittest discover -s tests -p test_research_dashboard.py -v
          python3 scripts/build_research_dashboard.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
