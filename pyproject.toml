[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-edr-extend"
version = "0.1.0"
description = "Formula and table OCR repair experiments with explicit rendering state"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
eval = ["PyYAML>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Tests can run from a source checkout without installing the package.
"tests/*.py" = ["E402"]

[tool.black]
line-length = 100
target-version = ["py310"]
